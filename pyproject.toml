[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-flow"
version = "0.1.0"
description = "Standalone writing rules for Claude Code and Codex"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Synx-x"}]
dependencies = []

[project.scripts]
writing-flow = "writing_flow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
writing_flow = ["defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
