name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python3 -m pytest -q
      - run: writing-flow check README.md AGENTS.md docs/rules.md docs/configuration.md docs/provenance.md docs/parity.md skills rules output-styles agents commands
